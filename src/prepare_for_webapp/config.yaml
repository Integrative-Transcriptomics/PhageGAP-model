#################################################################################
# Hydra configuration for preparing pooled protein sequence embeddings. 
# Values can be modified via CLI overrides, e.g.:
#   python src/prepare_for_webapp/run_prepare.py umap.n_neighbors=50
#################################################################################

seed: 42

data:
  embedding: outputs/pool/.../protein_embeddings_prot_t5__mean.h5 # adjust based on directory name

pool: 
  bool: False
  layers: [] # optional explicit layers list, e.g. [1, 3, 5, 9]; take last hidden layer/final representation if empty
  strategy: mean # mean | max | FC

cluster:
  representatives: inputs/Phage_0.95.tsv
  
mapping:
  colname: assigned_subcat

bac_vir:
  bool: True
  embedded: outputs/pool/.../protein_embeddings_prot_t5__mean.h5 # adjust based on directory name

pca:
  n_components: 50
  type: incremental # normal | incremental

tsne:
  perplexity: 50
  metric: euclidean

hydra:
  run:
    dir: outputs/prepare/${now:%Y-%m-%d_%H-%M-%S}